{% extends 'base.html' %}{% block title %}Login · Library{% endblock %}{% block content %}<section class="card narrow login-card"><img src="{{ url_for('static', filename='icons/library-logo.svg') }}" alt="Library logo" class="login-logo"><h1>Welcome back</h1><p class="muted">Log in to visit your library.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><label>Email</label><input type="email" name="email" required autocomplete="email"></div><div class="form-row"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div><button>Log in</button></form><p>New student? <a href="{{ url_for('signup') }}">Create an account</a></p></section>{% endblock %}

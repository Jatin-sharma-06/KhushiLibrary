{% extends 'base.html' %}{% block content %}<div class="actions" style="justify-content:space-between"><h1>Manage students</h1><a class="button" href="{{ url_for('add_student') }}">Add student</a></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Reset password</th><th>Delete</th></tr></thead><tbody>{% for user in users %}<tr><td>{{ user.User_ID }}</td><td>{{ user.Name }}</td><td>{{ user.Email }}</td><td><form class="actions" method="post" action="{{ url_for('reset_password', user_id=user.User_ID) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="password" name="password" placeholder="New password" required style="max-width:150px"><input type="password" name="confirm_password" placeholder="Confirm" required style="max-width:150px"><button>Reset</button></form></td><td><form method="post" action="{{ url_for('remove_user', user_id=user.User_ID) }}" onsubmit="return confirm('Delete this student account? Feedback history will remain.')"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No students registered.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}

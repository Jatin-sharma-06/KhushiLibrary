{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>My profile</h1><img class="profile" src="{{ url_for('static', filename='profiles/default.svg') }}" alt="Default profile picture"><p><b>Name:</b> {{ user.Name }}</p><p><b>Email:</b> {{ user.Email }}</p><p><b>Role:</b> {{ user.Role }}</p><hr><h2>Change password</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><label>Current password</label><input type="password" name="current_password" required></div><div class="form-row"><label>New password</label><input type="password" name="new_password" required></div><div class="form-row"><label>Confirm new password</label><input type="password" name="confirm_password" required></div><button>Change password</button></form></section>{% endblock %}

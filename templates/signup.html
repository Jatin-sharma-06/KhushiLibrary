{% extends 'base.html' %}{% block title %}Sign up · Library{% endblock %}{% block content %}<section class="card narrow"><h1>Create student account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><label>Full name</label><input name="name" required></div><div class="form-row"><label>Email</label><input type="email" name="email" required></div><div class="form-row"><label>Password</label><input type="password" name="password" required></div><div class="form-row"><label>Confirm password</label><input type="password" name="confirm_password" required></div><button>Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}

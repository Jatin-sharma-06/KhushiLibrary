{% extends 'base.html' %}{% block content %}<h1>My feedback</h1><section class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-row"><label>Message</label><textarea name="message" required maxlength="2000"></textarea></div><button>Submit feedback</button></form></section>{% for item in feedback|reverse %}<article class="card"><p><b>{{ item.Date_Submitted }}</b> · {{ item.Status }}</p><p>{{ item.Message }}</p><p><b>Administrator reply:</b> {{ item.Admin_Reply or 'No reply yet.' }}</p></article>{% else %}<p class="muted">You have not sent feedback yet.</p>{% endfor %}{% endblock %}

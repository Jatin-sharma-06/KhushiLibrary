{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>Add a book</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for key,label in [('title','Title'),('author','Author'),('category','Category')] %}<div class="form-row"><label>{{ label }}</label><input name="{{ key }}" required></div>{% endfor %}<div class="form-row"><label>Description</label><textarea name="description"></textarea></div><div class="form-row"><label>PDF file (up to 10 MB)</label><input type="file" name="pdf" accept="application/pdf,.pdf" required></div><button>Save book</button> <a class="button secondary" href="{{ url_for('books') }}">Cancel</a></form></section>{% endblock %}
